[build]
  publish = "."
  command = "echo Static shop clone ready"

# Optional: set AA_ADMIN_PASSWORD in Netlify UI (Site settings → Environment variables)
# to override the temporary default baked into netlify/functions/analytics.mjs
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Admin + analytics API must win over the SPA catch-all below
[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200
  force = true

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/widgets/checkout/info"
  to = "/stubs/widgets/checkout/info.html"
  status = 200

# Vehicle finder API (Shopware aateile vehicle-selector plugin)
[[redirects]]
